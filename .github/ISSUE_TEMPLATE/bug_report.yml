name: Bug Report
description: Report a reproducible bug or unexpected behavior.
title: "[Bug]: "
labels: ["type: bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include enough detail for maintainers to reproduce the issue. For security issues, do not open a public issue; use the private channel in [SECURITY.md](https://github.com/laochendeai/ai-adversarial-protocol/security/policy).

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe what happened and what you expected.
      placeholder: |
        I ran `aap probe`; model X was marked unsupported even though it supports tool-calling...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest command sequence that triggers the issue.
      placeholder: |
        1. `aap config add ...`
        2. `aap probe`
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior or error output
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AAP version or commit
      placeholder: "`aap --version` or `git log -1 --format=%h`"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "`node -v`"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (native)
        - Windows + WSL2
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Include redacted config snippets, provider names, terminal screenshots, or related issues. Never paste API keys.
