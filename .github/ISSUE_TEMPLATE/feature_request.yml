name: Feature Request
description: Propose a new capability or improvement.
title: "[Feature]: "
labels: ["type: feature", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [roadmap](https://github.com/laochendeai/ai-adversarial-protocol/blob/main/docs/ROADMAP.md) and existing issues before filing. Chinese-language reports are welcome too.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow pain before proposing a solution.
      placeholder: |
        When I run fact-heavy prompts, I need to know which models actually called tools and which answers were unsupported...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, API, CLI command, or TUI change you want.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you try or consider?

  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Engine core (AdversarialEngine / EngineHub)
        - Tool system (src/lib/tools/)
        - Model clients (OpenAI / Anthropic / Ollama)
        - HTTP server / compatibility APIs
        - TUI
        - CLI
        - Tests / CI / build
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
